name: heatflow-intraplate-residuals

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip

# Core scientific stack

  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - xarray
  - netcdf4
  - statsmodels>=0.14
  - scikit-learn>=1.3
  - patsy
  - pygam

# Visualization

  - matplotlib>=3.7

# Geospatial (critical for pipeline)

  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  - fiona
  - rtree
  - pyogrio>=0.7
  - cartopy>=0.22
  - rasterio
  - geodatasets

# Notebook / UI

  - jupyterlab>=4.0
  - ipywidgets

# IO

  - openpyxl
  - xlrd
  - pyarrow

# Utilities

  - tqdm
  - rich

# Graphviz (for workflow diagrams)

  - graphviz
  - python-graphviz

# Optional but recommended (stability + compatibility)

  - seaborn
